# Dependency updates for the static website repository.
# Python tooling is not declared by a requirements.txt, pyproject.toml,
# setup.py, Pipfile, or other supported Python dependency manifest.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Sarajevo" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "security"]
