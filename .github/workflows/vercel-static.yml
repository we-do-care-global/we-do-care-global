name: Vercel static build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/build-vercel.mjs
      - run: node scripts/build-vercel.mjs
      - name: Validate published source
        run: python3 scripts/check_site.py docs
